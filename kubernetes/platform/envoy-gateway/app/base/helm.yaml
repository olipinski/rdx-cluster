---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  releaseName: envoy-gateway
  targetNamespace: envoy-gateway-system
  install:
    remediation:
      retries: 3
    crds: Skip # Gateway API is managed separately to ensure Cilium compatibility
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: envoy-gateway-helm-values
      valuesKey: base-values.yaml
