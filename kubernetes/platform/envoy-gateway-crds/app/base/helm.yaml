---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-crds
  releaseName: envoy-gateway-crds
  targetNamespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: envoy-gateway-crds-helm-values
      valuesKey: base-values.yaml
