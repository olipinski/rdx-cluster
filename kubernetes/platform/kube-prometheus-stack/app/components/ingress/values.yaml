---
# kube-prom-stack helm values (ingress)

alertmanager:
  # Configure Ingress
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-issuer
      cert-manager.io/common-name: alertmanager.${CLUSTER_DOMAIN}
      # Oauth2-proxy
      nginx.ingress.kubernetes.io/auth-signin: https://oauth2-proxy.${CLUSTER_DOMAIN}/oauth2/start?rd=https://$host$request_uri
      nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth
      nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
      nginx.ingress.kubernetes.io/auth-response-headers: Authorization
    pathType: ImplementationSpecific
    hosts:
      - alertmanager.${CLUSTER_DOMAIN}
    tls:
      - hosts:
          - alertmanager.${CLUSTER_DOMAIN}
        secretName: alertmanager-tls

prometheus:
  # Configuring Ingress
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-issuer
      cert-manager.io/common-name: prometheus.${CLUSTER_DOMAIN}
      # Oauth2-proxy
      nginx.ingress.kubernetes.io/auth-signin: https://oauth2-proxy.${CLUSTER_DOMAIN}/oauth2/start?rd=https://$host$request_uri
      nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth
      nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
      nginx.ingress.kubernetes.io/auth-response-headers: Authorization
    pathType: ImplementationSpecific
    hosts:
      - prometheus.${CLUSTER_DOMAIN}
    tls:
      - hosts:
          - prometheus.${CLUSTER_DOMAIN}
        secretName: prometheus-tls
